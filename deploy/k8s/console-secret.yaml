#
# Operator token for the console's local sign-in path.
#
# Replace the placeholder before applying — or, better, let kubectl generate it
# so the value never lands in git:
#
#   kubectl -n openshell create secret generic openshell-console-auth \
#     --from-literal=operator-token="$(openssl rand -hex 24)" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# The same value is what you type into the welcome page's "local console" box.
# Rotating it invalidates existing sessions.
apiVersion: v1
kind: Secret
metadata:
  name: openshell-console-auth
  labels:
    app.kubernetes.io/name: openshell-console
    app.kubernetes.io/component: console
type: Opaque
stringData:
  operator-token: replace-me-with-a-long-random-string
