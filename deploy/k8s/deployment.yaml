#
# OpenShell Console — Deployment + Service, meant to run in the SAME namespace
# as the OpenShell gateway so it can reach the gRPC service over cluster DNS and
# read the gateway's client TLS Secret.
#
# Apply with:
#   kubectl apply -n openshell -k deploy/k8s
#
# Values to check against your release (helm defaults shown):
#   kubectl -n openshell get svc openshell
#   kubectl -n openshell get secret openshell-client-tls -o jsonpath='{.data}' | jq 'keys'
#
# The chart names both from values.server.tls.certSecretName / clientTlsSecretName.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openshell-console
  labels:
    app.kubernetes.io/name: openshell-console
    app.kubernetes.io/component: console
---
apiVersion: v1
kind: Service
metadata:
  name: openshell-console
  labels:
    app.kubernetes.io/name: openshell-console
    app.kubernetes.io/component: console
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: openshell-console
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openshell-console
  labels:
    app.kubernetes.io/name: openshell-console
    app.kubernetes.io/component: console
spec:
  # The bridge keeps sign-in sessions and the CLI's gateway registry in pod
  # memory / an emptyDir, so scale out only behind sticky sessions.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openshell-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openshell-console
        app.kubernetes.io/component: console
    spec:
      serviceAccountName: openshell-console
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console
          image: openshell-console:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8787
              protocol: TCP
          env:
            # --- console auth: the bridge binds 0.0.0.0, so it must have a
            # credential path. Swap for OIDC by setting OPENSHELL_UI_AUTH=oidc
            # and the OPENSHELL_UI_OIDC_* / ENTRA variables, then sign in with
            # your IdP instead of the operator token.
            - name: OPENSHELL_UI_AUTH
              value: local
            - name: OPENSHELL_UI_LOCAL_TOKEN_FILE
              value: /run/secrets/console-auth/operator-token
            - name: OPENSHELL_UI_REQUIRE_AUTH
              value: "1"
            # Public origin, needed for OIDC redirect URIs behind an Ingress.
            # - name: OPENSHELL_UI_PUBLIC_URL
            #   value: https://console.example.com
            # --- gateway connection: same namespace, so the gRPC service is a
            # cluster-DNS name. Plaintext gateways: use http:// and drop the
            # mTLS volume below (the entrypoint detects the missing cert).
            - name: GATEWAY_NAME
              value: openshell
            - name: GATEWAY_ENDPOINT
              value: https://openshell.openshell.svc.cluster.local:8080
            - name: GATEWAY_TLS_DIR
              value: /secrets/gateway-mtls
            # Keep the CLI registry and the bridge's token scratch space on the
            # writable volume, never in the image layer.
            - name: XDG_CONFIG_HOME
              value: /config
            - name: OPENSHELL_UI_CONFIG_DIR
              value: /config/openshell
            # Fail the pod instead of serving a disconnected console.
            - name: REQUIRE_GATEWAY
              value: "0"
            # Only when the server SAN cannot match the endpoint.
            # - name: GATEWAY_INSECURE
            #   value: "1"
          volumeMounts:
            - name: cli-config
              mountPath: /config
            - name: tmp
              mountPath: /tmp
            - name: gateway-mtls
              mountPath: /secrets/gateway-mtls
              readOnly: true
            - name: console-auth
              mountPath: /run/secrets/console-auth
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/auth/config
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/auth/config
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        # CLI gateway registry + console session scratch.
        - name: cli-config
          emptyDir: {}
        # server/index.ts writes policy/profile YAML to os.tmpdir().
        - name: tmp
          emptyDir: {}
        # The gateway's CLIENT certificate: ca.crt + tls.crt + tls.key.
        # `optional: true` lets the same Deployment run against a plaintext
        # gateway; drop it (and GATEWAY_TLS_DIR) to require mTLS.
        - name: gateway-mtls
          secret:
            secretName: openshell-client-tls
            optional: true
        # Operator token for the local console sign-in (see console-secret.yaml).
        - name: console-auth
          secret:
            secretName: openshell-console-auth
